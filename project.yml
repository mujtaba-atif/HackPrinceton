name: Iris

options:
  bundleIdPrefix: com.iris
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: 3.3.1
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    majorVersion: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  Iris:
    type: application
    platform: iOS
    sources:
      - path: Iris
        excludes:
          - Resources/Info.plist
          - Resources/Fonts
          - Secrets.swift.example
      - path: Iris/Resources/Fonts
        type: folder
        buildPhase: resources
    info:
      path: Iris/Resources/Info.plist
      properties:
        CFBundleDisplayName: Iris
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Camera is used to detect hands and objects with AR."
        NSMicrophoneUsageDescription: "Iris listens for your voice commands."
        NSSpeechRecognitionUsageDescription: "Iris uses speech recognition to understand your voice commands."
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDuration: true
        UILaunchScreen: {}
        UIAppFonts:
          - Fonts/Nunito-SemiBold.ttf
          - Fonts/Nunito-Bold.ttf
          - Fonts/Nunito-ExtraBold.ttf
          - Fonts/Nunito-Black.ttf
          - Fonts/NunitoSans-Bold.ttf
          - Fonts/NunitoSans-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Create Secrets.swift
        inputFiles:
          - $(SRCROOT)/Iris/Secrets.swift.example
        outputFiles:
          - $(SRCROOT)/Iris/Secrets.swift
        script: |
          if [ ! -f "$SRCROOT/Iris/Secrets.swift" ]; then
            cp "$SRCROOT/Iris/Secrets.swift.example" "$SRCROOT/Iris/Secrets.swift"
            echo "warning: Created Iris/Secrets.swift from the template. Add your ElevenLabs key, agent ID and voice ID."
          fi
    dependencies:
      - package: ElevenLabs
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iris.ios
        PRODUCT_NAME: Iris
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  IrisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IrisTests
    dependencies:
      - target: Iris
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.iris.ios.tests

schemes:
  Iris:
    build:
      targets:
        Iris: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IrisTests
    archive:
      config: Release

